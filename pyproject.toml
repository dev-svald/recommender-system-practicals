[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-practicals"
version = "1.0.0"
description = "Large-scale Recommender Systems practicals implementing ALS Matrix Factorization with Numba JIT on MovieLens"
readme = "README.md"
authors = [
    { name = "dev-svald", email = "30782937@sun.ac.za" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
acceleration = [
    "numba>=0.57.0",
]
visualization = [
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
all = [
    "numba>=0.57.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
